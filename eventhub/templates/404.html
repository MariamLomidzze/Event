{% extends "base.html" %}
{% block title %}Page Not Found - EventHub{% endblock %}
{% block content %}
<div class="error-page">
    <div class="error-code">404</div>
    <h3>This page doesn't exist.</h3>
    <p class="text-muted">The event or page you're looking for may have been moved or deleted.</p>
    <a href="{{ url_for('index') }}" class="btn btn-accent mt-3">Back to Events</a>
</div>
{% endblock %}
