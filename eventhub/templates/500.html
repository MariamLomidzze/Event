{% extends "base.html" %}
{% block title %}Server Error - EventHub{% endblock %}
{% block content %}
<div class="error-page">
    <div class="error-code">500</div>
    <h3>Something went wrong on our end.</h3>

    <a href="{{ url_for('index') }}" class="btn btn-accent mt-3">Back to Events</a>
</div>
{% endblock %}
